<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/icon.svg" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Copiloto de Carretera | Navegación y Seguridad</title>
    <meta name="description" content="Copiloto inteligente y de seguridad para carretera con navegación en tiempo real, OSRM y telemetría OBD-II." />
    <meta name="theme-color" content="#070b14" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Copiloto" />
    
    <!-- Leaflet CSS y JS para mapas fluidos en tiempo real -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- Tailwind CSS Script para estilos automotrices de alto contraste -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              slate: {
                950: '#070b14',
                900: '#0f172a',
                800: '#1e293b'
              }
            }
          }
        }
      }
    </script>
    <style>
      /* Estilos para el mapa Leaflet en modo carretera oscuro */
      .leaflet-container {
        background-color: #070b14 !important;
        font-family: inherit;
        width: 100% !important;
        height: 100% !important;
      }
      .leaflet-popup-content-wrapper {
        background: #0f172a !important;
        color: #f1f5f9 !important;
        border: 1px solid #334155 !important;
        border-radius: 14px !important;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.7) !important;
      }
      .leaflet-popup-tip {
        background: #0f172a !important;
      }
      .leaflet-control-zoom {
        border: 1px solid #334155 !important;
        border-radius: 12px !important;
        overflow: hidden;
      }
      .leaflet-control-zoom a {
        background: #0f172a !important;
        color: #f8fafc !important;
        border-bottom: 1px solid #334155 !important;
      }
      .leaflet-control-zoom a:hover {
        background: #1e293b !important;
      }

      /* Ocultar scrollbars en modo pantalla completa */
      html, body, #root {
        height: 100%;
        width: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body class="bg-slate-950 text-slate-100 min-h-screen antialiased selection:bg-amber-500 selection:text-black">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      // Registro automático de Service Worker para habilitar la instalación PWA en el celular
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('/sw.js').catch(err => {
            console.log('ServiceWorker no registrado:', err);
          });
        });
      }
    </script>
  </body>
</html>
